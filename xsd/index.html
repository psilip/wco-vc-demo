<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>WCO CoO XSD Explorer</title>

  <style>
    :root {
      color-scheme: light dark;
      --background: Canvas;
      --foreground: CanvasText;
      --muted: color-mix(in srgb, CanvasText 60%, transparent);
      --border: color-mix(in srgb, CanvasText 18%, transparent);
      --panel: color-mix(in srgb, CanvasText 5%, Canvas);
      --accent: #2563eb;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--foreground);
      font-family:
        system-ui,
        -apple-system,
        "Segoe UI",
        sans-serif;
    }

    header {
      padding: 1.2rem clamp(1rem, 3vw, 2.5rem) 1rem;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
    }

    h1 {
      margin: 0 0 0.25rem;
      font-size: clamp(1.35rem, 2.5vw, 2rem);
    }

    header p {
      margin: 0;
      color: var(--muted);
    }

    .controls {
      display: grid;
      grid-template-columns:
        minmax(18rem, 2fr)
        minmax(12rem, 1fr)
        auto
        auto;
      gap: 0.8rem;
      align-items: end;
      padding: 1rem clamp(1rem, 3vw, 2.5rem);
      border-bottom: 1px solid var(--border);
    }

    label {
      display: grid;
      gap: 0.3rem;
      font-weight: 650;
    }

    select,
    button,
    a.button {
      min-height: 2.5rem;
      border: 1px solid var(--border);
      border-radius: 0.45rem;
      padding: 0.45rem 0.65rem;
      background: var(--background);
      color: var(--foreground);
      font: inherit;
    }

    button,
    a.button {
      cursor: pointer;
      font-weight: 650;
    }

    button:hover,
    a.button:hover {
      border-color: var(--accent);
    }

    a.button {
      display: inline-flex;
      align-items: center;
      text-decoration: none;
    }

    #status {
      min-height: 1.5rem;
      padding: 0.45rem clamp(1rem, 3vw, 2.5rem);
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      font-size: 0.92rem;
    }

    #viewer {
      width: 100%;
      height: calc(100vh - 12.5rem);
      min-height: 38rem;
      border: 0;
      background: white;
    }

    .error {
      color: #b91c1c !important;
    }

    @media (max-width: 850px) {
      .controls {
        grid-template-columns: 1fr 1fr;
      }

      #viewer {
        height: calc(100vh - 17rem);
      }
    }

    @media (max-width: 560px) {
      .controls {
        grid-template-columns: 1fr;
      }

      #viewer {
        height: 70vh;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>WCO Certification of Origin XSD Explorer</h1>

    <p>
      Select a schema and switch between the outline and tabular
      transformations.
    </p>
  </header>

  <section
    class="controls"
    aria-label="Schema view controls"
  >
    <label>
      Schema

      <select id="schemaSelect">
        <option value="e_CO_4p3p0.xsd">
          CoO Information Package structure
        </option>

        <option
          value="e_CO_4p3p0_urn_wco_datamodel_WCO_e_CO_DS_4.xsd"
        >
          CoO datatype definitions
        </option>
      </select>
    </label>

    <label>
      Transformation

      <select id="transformSelect">
        <option value="xsd-outline-view.xsl">
          Outline view
        </option>

        <option value="xsd-table-view.xsl">
          Table view
        </option>
      </select>
    </label>

    <button id="renderButton" type="button">
      Render
    </button>

    e_CO_4p3p0.xsd
      Open XSD directly
    </a>
  </section>

  <div
    id="status"
    role="status"
    aria-live="polite"
  >
    Loading…
  </div>

  <iframe
    id="viewer"
    title="Transformed XSD view"
  ></iframe>

  <script>
    const schemaSelect =
      document.getElementById("schemaSelect");

    const transformSelect =
      document.getElementById("transformSelect");

    const renderButton =
      document.getElementById("renderButton");

    const rawLink =
      document.getElementById("rawLink");

    const status =
      document.getElementById("status");

    const viewer =
      document.getElementById("viewer");


    function parseXml(text, fileName) {
      const documentNode =
        new DOMParser().parseFromString(
          text,
          "application/xml"
        );

      const parserError =
        documentNode.querySelector("parsererror");

      if (parserError) {
        throw new Error(
          "Could not parse " +
          fileName +
          ": " +
          parserError.textContent.trim()
        );
      }

      return documentNode;
    }


    async function fetchText(path) {
      const response = await fetch(
        path,
        {
          cache: "no-cache"
        }
      );

      if (!response.ok) {
        throw new Error(
          path +
          " returned HTTP " +
          response.status
        );
      }

      return response.text();
    }


    function writeResult(resultDocument) {
      const resultHtml =
        "<!doctype html>\n" +
        new XMLSerializer().serializeToString(
          resultDocument
        );

      viewer.srcdoc = resultHtml;
    }


    async function render() {
      const schemaPath =
        schemaSelect.value;

      const transformPath =
        transformSelect.value;

      rawLink.href = schemaPath;

      status.classList.remove("error");

      status.textContent =
        "Rendering " +
        schemaPath +
        " with " +
        transformPath +
        "…";

      renderButton.disabled = true;

      try {
        if (typeof XSLTProcessor === "undefined") {
          throw new Error(
            "This browser does not expose the " +
            "XSLTProcessor API. Try Firefox or " +
            "another browser with client-side " +
            "XSLT support."
          );
        }

        const [
          schemaText,
          transformText
        ] = await Promise.all([
          fetchText(schemaPath),
          fetchText(transformPath)
        ]);

        const schemaDocument =
          parseXml(
            schemaText,
            schemaPath
          );

        const transformDocument =
          parseXml(
            transformText,
            transformPath
          );

        const processor =
          new XSLTProcessor();

        processor.importStylesheet(
          transformDocument
        );

        const resultDocument =
          processor.transformToDocument(
            schemaDocument
          );

        writeResult(resultDocument);

        status.textContent =
          schemaPath +
          " · " +
          transformSelect.options[
            transformSelect.selectedIndex
          ].text;

        const pageUrl =
          new URL(window.location.href);

        pageUrl.searchParams.set(
          "schema",
          schemaPath
        );

        pageUrl.searchParams.set(
          "view",
          transformPath
        );

        history.replaceState(
          null,
          "",
          pageUrl
        );
      } catch (error) {
        viewer.srcdoc = "";

        status.classList.add("error");

        status.textContent =
          error.message;

        console.error(error);
      } finally {
        renderButton.disabled = false;
      }
    }


    function restoreSelectionFromUrl() {
      const parameters =
        new URLSearchParams(
          window.location.search
        );

      const requestedSchema =
        parameters.get("schema");

      const requestedView =
        parameters.get("view");

      const schemaExists =
        [...schemaSelect.options].some(
          option =>
            option.value === requestedSchema
        );

      const viewExists =
        [...transformSelect.options].some(
          option =>
            option.value === requestedView
        );

      if (requestedSchema && schemaExists) {
        schemaSelect.value =
          requestedSchema;
      }

      if (requestedView && viewExists) {
        transformSelect.value =
          requestedView;
      }
    }


    renderButton.addEventListener(
      "click",
      render
    );

    schemaSelect.addEventListener(
      "change",
      render
    );

    transformSelect.addEventListener(
      "change",
      render
    );

    restoreSelectionFromUrl();
    render();
  </script>
</body>
</html>
